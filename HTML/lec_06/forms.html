<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Forms</h1>

    <div>

        <fieldset>
            <legend>enter your basic details</legend>

            
            <form action="welcome_page.html" target="_blank">

                <label for="fullname"> FULL NAME :</label>
                <input type="text" id="fullname" placeholder="Enter your name" required>


                <BR></BR>


                <label for="fullEMAIL">FULL EMAIL</label>
                <input type="email" id="fullEMAIL" placeholder="Enter your EMAIL" required>


                <BR></BR>


                <label for="password">password</label>
                <input type="password" id="password" placeholder="Enter your password" required>


                <BR></BR>


                <label for="checkbox">are you 18+</label>
                <input type="checkbox" id="checkbox" required>


                <BR></BR>


                <label for="PHONENUMBER">NUMBER</label>
                <input type="number" id="PHONENUMBER" placeholder="Enter your NUMBER" required minlength="10" min="0"
                    maxlength="10">


                <BR></BR>


                <label for="GENDER">YOUR GENDER : </label>
                <label for="GENDER"> MALE</label>
                <input type="radio" id="GENDER" name="GENDER">
                <label for="GENDER">FEMALE</label>
                <input type="radio" id="GENDER" name="GENDER">


                <BR></BR>

                <label for="dob">eneter your dob</label>
                <input type="date" id="dob" placeholder="enter your DOB">

                <BR></BR>

                <label for="file">Upload your file</label>
                <input type="file" id="file" placeholder="upload your file">

                <BR></BR>

                <label for="">Select Your City</label>
                <select name="" id="">
                    <option value="MUMBAI">MUMBAI</option>
                    <option value="DELHI">DELHI</option>
                    <option value="JAIPUR">JAIPUR</option>
                    <option value="JHARKHAND">JHARKHAND</option>
                    <option value="BIHAR">BIHAR</option>
                    <option value="UTTAR PRADESH">UTTAR PRADESH</option>
                    <option value="KOLKATA">KOLKATA</option>
                </select>

                <BR></BR>



                <button> Submit Form</button>
            </form>
        </fieldset>
    </div>
</body>

</html>
